  software: ANSYS Fluent
  solver: "TO CONFIRM — pressure-based / density-based, steady or transient, and the pressure-velocity coupling scheme"
  domain: "TO CONFIRM — domain dimensions in chord lengths, and whether a symmetry plane was used"
  turbulence_model: "TO CONFIRM — the model used in the final study"

  mesh:
    type: "TO CONFIRM — element type, e.g. polyhedral, tetrahedral with inflation, poly-hexcore"
    elements: "TO CONFIRM — final cell count"
    y_plus: "TO CONFIRM — y+ range achieved on the element surfaces"
    inflation_layers: "TO CONFIRM — number of layers and growth rate"
    independence: |
      The aerodynamic coefficients were computed on successively refined meshes
      under identical boundary conditions and solver settings. Refinement
      continued until further refinement no longer changed the coefficients
      meaningfully, and that resolution was then held fixed for every geometry
      revision in the study.

      This is the step that makes the rest of the comparisons valid: it
      establishes that a change in drag between two geometries is caused by the
      geometry and not by the mesh resolving the flow differently.

