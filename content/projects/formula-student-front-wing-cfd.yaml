title: Aerodynamic optimisation of a multi-element Formula Student front wing
subtitle: MSc dissertation — ANSYS Fluent, SpaceClaim
summary: >
  Aerodynamic analysis and optimisation of a multi-element Formula Student front
  wing in ANSYS Fluent. Geometry designed in CAD, meshed to a demonstrated
  mesh-independent resolution, and assessed on pressure and velocity contours.
  Iterative optimisation cut drag by roughly 45% while improving aerodynamic
  efficiency.

