  #   - { name: Outlet, value: "TO CONFIRM — pressure outlet, gauge pressure" }
  #   - { name: Wing surfaces, value: "No-slip wall" }
  #   - { name: Ground, value: "TO CONFIRM — moving wall at freestream velocity, or stationary" }
  #   - { name: Domain sides and top, value: "TO CONFIRM — symmetry or free-slip wall" }

  convergence: |
    TO CONFIRM — state the residual levels reached and, more usefully, confirm
    that the drag and lift monitors were flat over the final iterations. A
    monitor that has stopped moving is stronger evidence of convergence than a
    residual threshold on its own.

  results: |
    Analysis focused on two things:

    **Static pressure distribution** over the element surfaces, which shows where
    the wing is actually generating load and where pressure recovery is running
    out on the flap suction surfaces. This is what identifies the element angle
    and slot gap that are limiting the configuration.

    **Velocity contours** through the slot gaps and into the wake, which show
    whether the flow stays attached through the gaps and how much momentum
    deficit the wing leaves behind it. Separation appearing in the contours is
    the direct explanation for a revision that added drag without adding
    downforce.

    Read together, these are what turned each iteration from "the number moved"
    into a reason the number moved — and that reasoning is what drove the next
    geometry change.

