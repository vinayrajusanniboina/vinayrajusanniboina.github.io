headline: About
profile: |
  I am an electrical engineer working on electric vehicles, with a first-class
  BEng in Electrical and Electronics Engineering specialising in electric
  vehicles and an MSc in Automotive Engineering for Electric Vehicles from the
  University of Bedfordshire. My grounding is in the electric powertrain —
  electrical machines, power electronics, motor control and battery systems —
  backed by simulation and analysis in MATLAB/Simulink and ANSYS.
  In the final year of my BEng I spent six months as a junior site supervisor
  intern with Shri Abhirami Engineering Works in Chennai, supporting the
  installation, testing and commissioning of power transformers — preparing
  sites ahead of delivery, working alongside senior engineers through testing
  and commissioning, and carrying out transformer oil changes and maintenance.
  After graduating I spent two months as a CAE engineering intern in a product
  development research group, working on battery thermal management systems
  using nanofluids for electric vehicles — analysing coolant and heat transfer
  behaviour across a pack, and presenting findings that tied the analysis back
  to decisions a pack designer would actually face.
  During the MSc I was part of Team Bedfordshire Racing's 24-member Formula
  Student team, manufacturing and assembling vehicle components and checking
  them against drawings and the technical regulations. My dissertation was a
  CFD study of a multi-element front wing, where iterative optimisation in
  ANSYS Fluent produced roughly a 45% reduction in drag.
  I am looking for a UK graduate or junior engineering role in EV powertrain,
  power electronics, battery management systems or electrical testing and
  commissioning.
