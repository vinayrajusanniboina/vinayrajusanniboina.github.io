headline: About
profile: |
  I am an automotive engineer working on electric vehicles, with an MSc in
  Automotive Engineering for Electric Vehicles from the University of
  Bedfordshire and a first-class BEng in Electrical and Electronics Engineering
  specialising in electric vehicles.

  My background sits across mechanical design, vehicle dynamics and
  simulation-driven analysis — CAD, FEA and CFD. My dissertation was an
  aerodynamic study of a multi-element Formula Student front wing, where
  iterative optimisation in ANSYS Fluent produced roughly a 45% reduction in
  aerodynamic drag alongside improved aerodynamic efficiency.

  Before the MSc I spent two months as a CAE engineering intern in a product
  development research group, working on battery thermal management systems
  using nanofluids for electric vehicles — analysing coolant and heat transfer
  behaviour across a pack, and presenting findings that tied the analysis back
  to decisions a pack designer would actually face.

  Alongside the MSc I was on chassis for Formula Student Bedfordshire Racing, in
  a 24-member team. That work took chassis components from concept design in
  SOLIDWORKS through to workshop manufacture — cutting, welding, fabrication and
  assembly — against stiffness, packaging and cost targets on a fixed project
  deadline. The most useful thing I took from it was not the CAD. It was
  building the parts I had drawn, discovering which of my drawings were
  optimistic, and learning to check a component against its drawing before it
  goes anywhere near an assembly rather than after.

  I am looking for a graduate engineering role, with particular interest in
  simulation-led design, validation and quality assurance.
