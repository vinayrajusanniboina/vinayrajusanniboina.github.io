headline: About

profile: |
  I am an automotive engineer working on electric vehicles, with an MSc in
  Automotive Engineering for Electric Vehicles from the University of
  Bedfordshire and a first-class BEng in Electrical and Electronics Engineering
  specialising in electric vehicles.

  My background sits across mechanical design, vehicle dynamics and
  simulation-driven analysis — CAD, FEA and CFD. My dissertation was an
  aerodynamic study of a multi-element Formula Student front wing, where
  iterative optimisation in ANSYS Fluent produced roughly a 45% reduction in
  aerodynamic drag alongside improved aerodynamic efficiency.

  Alongside the MSc I was on chassis for Formula Student Bedfordshire Racing,
  competing in Concept Class. That work took the chassis from concept design
  through build and in-house track testing, against stiffness, packaging and
  cost targets on a fixed competition deadline. The most useful thing I took
  from it was not the CAD: it was tracing an instability under acceleration back
  to compliance in the rear engine mounting, revising the mounting, and
  confirming the fix through driver feedback across subsequent runs.

  I am looking for a graduate programme in vehicle engineering, with particular
  interest in simulation-led design, validation and quality assurance.

